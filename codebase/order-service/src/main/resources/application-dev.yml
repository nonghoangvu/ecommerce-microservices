spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DB:order_db}
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS:localhost:29092}
    topic: checkout-order-topic
openapi:
  service:
    api-docs: order-service
    server: ${HOST_NAME:http://localhost}:8085
    title: Order service
    version: 1.0.0