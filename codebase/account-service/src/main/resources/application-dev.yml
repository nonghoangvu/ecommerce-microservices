spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  messages:
    basename: messages
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}
    username: ${DATABASE_USERNAME:dev}
    password: ${DATABASE_PASSWORD:password}
    hikari: # Connection poll
      max-lifetime: 300000      # 5 phút
      idle-timeout: 60000       # 1 phút
      validation-timeout: 5000  # 5 giây
      minimum-idle: 5
      maximum-pool-size: 20
    jpa:
      show-sql: false
      hibernate:
        ddl-auto: none
    servlet:
      multipart:
        enabled: true
        max-file-size: 5GB
        max-request-size: 5GB
openapi:
  service:
    api-docs: account-service
    server: ${HOST_NAME:http://localhost}:4953/account
    title: Account service
    version: 1.0.0